name: User Service CI/CD

on:
  push:
    branches: [ "main", "master", "dev", "feature/**" ]
    paths:
      - 'patient-service/**'
      - 'pom.xml'
  pull_request:
    branches: [ "main", "master", "dev" ]
    paths:
      - 'patient-service/**'
      - 'pom.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: 
      name: Production
      url: https://api-gateway.whitesky-a1a8232a.eastus.azurecontainerapps.io

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -pl patient-service -am

    - name: Log in to Azure Container Registry
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push Docker Image
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      env:
        REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        GH_SHA: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY_USERNAME.azurecr.io/patient-service:$GH_SHA -f patient-service/Dockerfile .
        docker push $REGISTRY_USERNAME.azurecr.io/patient-service:$GH_SHA

    - name: Azure Login
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: azure/login@33b121a1597278045654f321b0e9861297c5e9c0 # v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: azure/CLI@0df669690ef49b481fbac281873b305464e46984 # v1
      env:
        REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        MONGO_URI: ${{ secrets.MONGO_URI_PATIENT }}
        RABBITMQ_ADDR: ${{ secrets.RABBITMQ_ADDRESSES }}
        GH_SHA: ${{ github.sha }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      with:
        inlineScript: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp up --name patient-service --resource-group AppointmentApp-RG --environment AppointmentEnv --image $REGISTRY_USERNAME.azurecr.io/patient-service:$GH_SHA --registry-server $REGISTRY_USERNAME.azurecr.io --registry-username $REGISTRY_USERNAME --registry-password $REGISTRY_PASSWORD --ingress external --target-port 8081 --env-vars "SPRING_DATA_MONGODB_URI=$MONGO_URI" "SPRING_RABBITMQ_ADDRESSES=$RABBITMQ_ADDR" "JWT_SECRET=$JWT_SECRET"

