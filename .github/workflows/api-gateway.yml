name: API Gateway CI/CD

on:
  push:
    branches: [ "main", "master", "dev", "feature/**" ]
    paths:
      - 'api-gateway/**'
      - 'pom.xml'
  pull_request:
    branches: [ "main", "master", "dev" ]
    paths:
      - 'api-gateway/**'
      - 'pom.xml'

concurrency:
  group: deploy-api-gateway
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f # v4.1.1

    - name: Set up JDK 17
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests -pl api-gateway -am

    - name: Log in to Azure Container Registry
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
      with:
        registry: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push Docker Image
      env:
        REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        GH_SHA: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY_USERNAME.azurecr.io/api-gateway:$GH_SHA -f api-gateway/Dockerfile .
        docker push $REGISTRY_USERNAME.azurecr.io/api-gateway:$GH_SHA

    - name: Azure Login
      uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v1.4.6
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      uses: azure/CLI@a93c94291de23018e69ee8ed2b123d53ee8f6f02 # v1.0.9
      env:
        REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        GH_SHA: ${{ github.sha }}
      with:
        inlineScript: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp up --name api-gateway --resource-group AppointmentApp-RG --environment AppointmentEnv --image $REGISTRY_USERNAME.azurecr.io/api-gateway:$GH_SHA --registry-server $REGISTRY_USERNAME.azurecr.io --registry-username $REGISTRY_USERNAME --registry-password $REGISTRY_PASSWORD --ingress external --target-port 8080
